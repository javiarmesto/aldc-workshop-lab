name: Workshop helpers
on:
  push:
    paths: ['tools/**', 'templates/**', '.github/workflows/helpers.yml']
  pull_request:
    paths: ['tools/**', 'templates/**', '.github/workflows/helpers.yml']
permissions:
  contents: read
jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate helpers in Windows PowerShell 5.1
        shell: powershell
        run: ./tools/tests/Test-WorkshopHelpers.ps1
  windows-pwsh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate helpers in PowerShell 7
        shell: pwsh
        run: ./tools/tests/Test-WorkshopHelpers.ps1
