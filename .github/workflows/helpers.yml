name: Workshop helpers
on:
  push:
    paths: ['tools/**', 'templates/**', '.github/workflows/helpers.yml']
  pull_request:
    paths: ['tools/**', 'templates/**', '.github/workflows/helpers.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Validate preparation and read-only checks
        shell: ${{ matrix.shell }}
        run: ./tools/tests/Test-WorkshopHelpers.ps1
